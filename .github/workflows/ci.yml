name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Luau, StyLua, and Selene
        run: |
          mkdir -p "$HOME/bin"
          curl -sSfL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip
          curl -sSfL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.6.0/stylua-linux-x86_64.zip
          curl -sSfL -o selene.zip https://github.com/Kampfkarren/selene/releases/download/0.32.0/selene-0.32.0-linux.zip
          for z in luau stylua selene; do unzip -o -q "$z.zip" -d "$HOME/bin"; done
          chmod +x "$HOME/bin"/*
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Format
        run: stylua --check skills
      - name: Lint
        run: selene skills
      - name: Tests
        run: python -m unittest discover -s tests -v
        env:
          LUAU: luau
